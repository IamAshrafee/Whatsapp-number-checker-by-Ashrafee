<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Numbers Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>WhatsApp Numbers Checker</h1>
      <span id="status" class="status-idle" aria-live="polite">Idle</span>
    </header>

    <section class="controls">
      <button id="runScript"><span>▶️</span> Start Checking</button>
      <button id="pauseResumeBtn" class="secondary-button" style="display: none;">⏸ Pause</button>
      <button id="clearLogs" class="secondary-button">Clear Logs</button>
      <button id="settingsButton" class="secondary-button" title="Settings">⚙️ Settings</button>
    </section>

    <!-- Progress Section -->
    <section id="progressSection" class="progress-section" style="display: none;">
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div class="progress-info">
        <span id="progressText">0/0 (0%)</span>
        <span id="timeEstimate"></span>
      </div>
    </section>

    <!-- Summary Section -->
    <section id="summarySection" class="summary-section" style="display: none;">
      <div class="summary-stats">
        <span class="stat-item stat-found">✅ Found: <strong id="summaryFound">0</strong></span>
        <span class="stat-item stat-not-found">❌ Not Found: <strong id="summaryNotFound">0</strong></span>
        <span class="stat-item stat-total">📊 Total: <strong id="summaryTotal">0</strong></span>
      </div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <h2>Results (<span id="user-count">0</span>)</h2>
        <button id="clearResults" class="secondary-button clear-result">Clear Results</button>
      </div>
      <div id="results-container">
        <table id="results-table">
          <thead>
            <tr>
              <th>Reference</th>
              <th>Number</th>
            </tr>
          </thead>
          <tbody>
            <!-- User data will be inserted here -->
          </tbody>
        </table>
      </div>
    </section>

    <section class="export-controls">
      <button id="exportJson" class="secondary-button">Export JSON</button>
      <button id="exportCsv" class="secondary-button">Export CSV</button>
      <button id="copyToClipboard" class="secondary-button">Copy</button>
    </section>

    <section class="log-section">
      <h2>Logs</h2>
      <div id="log-container"></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
